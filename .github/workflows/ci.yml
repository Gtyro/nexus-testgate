name: Testgate CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - run: python dist/testgate.pyz --show-policy
      - run: python -m pip install .
      - run: testgate --version
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull python:3.11-slim
      - run: python -m unittest discover -s tests -k DockerTests -v
        env:
          TESTGATE_DOCKER_TEST_IMAGE: python:3.11-slim
