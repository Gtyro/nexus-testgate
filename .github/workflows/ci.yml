name: Testgate CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=7,<9"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - run: python tools/check_archive.py
      - run: python dist/testgate.pyz --show-policy
      - run: python -m pip install .
      - run: testgate --version
      - name: Verify the installed package can provide its own Codex integration
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "${{ github.workspace }}/tests" -p test_codex.py -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/testgate-frontend" --no-save --ignore-scripts --no-audit --no-fund vitest@3.2.4 jest@30.2.0 @playwright/test@1.56.1
      - run: docker pull node:20-bookworm-slim
      - run: python -m unittest discover -s tests -p test_frontend_timing.py -v
        env:
          TESTGATE_FRONTEND_NODE_MODULES: ${{ runner.temp }}/testgate-frontend/node_modules
          TESTGATE_NODE_DOCKER_TEST_IMAGE: node:20-bookworm-slim
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pytest>=7,<9"
      - run: docker pull python:3.11-slim
      - run: python -m unittest discover -s tests -k Docker -v
        env:
          TESTGATE_DOCKER_TEST_IMAGE: python:3.11-slim
