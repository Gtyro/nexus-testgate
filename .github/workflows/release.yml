name: Publish zipapp

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/testgate.pyz dist/default-policy.json dist/SHA256SUMS --generate-notes --verify-tag
